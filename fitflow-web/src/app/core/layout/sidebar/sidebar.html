<aside
  class="fixed inset-y-0 left-0 z-50 flex w-72 -translate-x-full flex-col border-r border-slate-800 bg-slate-950 px-4 py-5 text-slate-100 shadow-2xl transition-transform duration-300 lg:translate-x-0 lg:shadow-none"
  [class.translate-x-0]="mobileOpen()">
  <div class="flex items-center justify-between border-b border-slate-800 px-2 pb-5">
    <a routerLink="/dashboard" class="flex items-center gap-3" (click)="close()">
      <span class="grid h-10 w-10 place-items-center rounded-xl bg-emerald-400 text-lg font-black text-slate-950">F</span>
      <span>
        <span class="block text-lg font-bold tracking-tight text-white">FitFlow</span>
        <span class="block text-xs font-medium text-slate-400">Gym management</span>
      </span>
    </a>
    <button type="button" class="rounded-lg p-2 text-slate-400 hover:bg-slate-800 hover:text-white lg:hidden" aria-label="Cerrar menú" (click)="close()">
      <svg viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" /></svg>
    </button>
  </div>

  <nav class="mt-6 flex-1" aria-label="Navegación principal">
    <p class="px-3 pb-3 text-[11px] font-bold uppercase tracking-[0.16em] text-slate-500">Operación</p>
    <div class="space-y-1">
      <a routerLink="/dashboard" routerLinkActive="bg-emerald-400 text-slate-950 shadow-sm" class="flex items-center gap-3 rounded-xl px-3 py-3 text-sm font-semibold text-slate-300 transition hover:bg-slate-800 hover:text-white" (click)="close()">
        <span class="grid h-5 w-5 place-items-center"><svg viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></span>
        Dashboard
      </a>
      <a routerLink="/clientes" routerLinkActive="bg-emerald-400 text-slate-950 shadow-sm" class="flex items-center gap-3 rounded-xl px-3 py-3 text-sm font-semibold text-slate-300 transition hover:bg-slate-800 hover:text-white" (click)="close()">
        <span class="grid h-5 w-5 place-items-center"><svg viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="8" r="3"/><path d="M5 21a7 7 0 0 1 14 0"/></svg></span>
        Clientes
      </a>
      <a routerLink="/rutinas" routerLinkActive="bg-emerald-400 text-slate-950 shadow-sm" class="flex items-center gap-3 rounded-xl px-3 py-3 text-sm font-semibold text-slate-300 transition hover:bg-slate-800 hover:text-white" (click)="close()">
        <span class="grid h-5 w-5 place-items-center"><svg viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 4v16M18 4v16M3 8h3M18 8h3M3 16h3M18 16h3M6 12h12"/></svg></span>
        Rutinas
      </a>
    </div>

    <p class="mt-8 px-3 pb-3 text-[11px] font-bold uppercase tracking-[0.16em] text-slate-500">Próximamente</p>
    <div class="space-y-1">
      @for (item of ['Asistencia', 'Pagos', 'Usuarios']; track item) {
        <span class="flex cursor-not-allowed items-center gap-3 rounded-xl px-3 py-3 text-sm font-medium text-slate-500" aria-disabled="true">
          <span class="h-2 w-2 rounded-full bg-slate-700"></span>{{ item }}
        </span>
      }
    </div>
  </nav>

  <div class="border-t border-slate-800 pt-4">
    <div class="mb-3 flex items-center justify-between px-2">
      <div><p class="text-xs font-bold uppercase tracking-[0.14em] text-emerald-400">FitFlow</p><p class="mt-1 text-xs text-slate-500">Panel de control</p></div>
      <button type="button" class="relative rounded-lg p-2 text-slate-400 transition hover:bg-slate-800 hover:text-white" aria-label="Notificaciones">
        <svg viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg>
        <span class="absolute right-2 top-2 h-2 w-2 rounded-full bg-emerald-400 ring-2 ring-slate-950"></span>
      </button>
    </div>
    <button type="button" class="flex w-full items-center gap-3 rounded-xl border border-slate-800 bg-slate-900/70 p-2 text-left transition hover:border-slate-700 hover:bg-slate-800">
      <span class="grid h-10 w-10 place-items-center rounded-xl border border-slate-700 bg-slate-800 text-xs font-bold text-slate-200">LM</span>
      <span class="min-w-0 flex-1"><span class="block truncate text-sm font-semibold text-slate-100">Law</span><span class="block truncate text-xs text-slate-400">Administrador</span></span>
      <svg viewBox="0 0 24 24" class="h-4 w-4 text-slate-400" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
    </button>
  </div>
</aside>
