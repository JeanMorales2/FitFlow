<div class="min-h-screen overflow-x-hidden bg-slate-50 font-sans text-slate-900 antialiased">
  @if (sidebarOpen()) {
    <button
      type="button"
      class="fixed inset-0 z-40 bg-slate-950/50 lg:hidden"
      aria-label="Cerrar menú de navegación"
      (click)="closeSidebar()"></button>
  }

  <app-sidebar [mobileOpen]="sidebarOpen()" (closeRequested)="closeSidebar()"></app-sidebar>

  <div class="min-h-screen min-w-0 lg:pl-72">
    <button type="button" class="fixed left-4 top-4 z-30 rounded-xl border border-slate-200 bg-white p-2.5 text-slate-700 shadow-sm lg:hidden" aria-label="Abrir menú de navegación" (click)="openSidebar()">
      <svg viewBox="0 0 24 24" class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <main class="mx-auto w-full max-w-[1600px] min-w-0 px-4 pb-4 pt-16 sm:px-6 sm:pb-6 sm:pt-6 lg:px-8 lg:pb-8 lg:pt-0">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
