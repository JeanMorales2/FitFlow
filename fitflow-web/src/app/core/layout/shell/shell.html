<div class="min-h-screen bg-slate-50 font-sans text-slate-900 antialiased">
  @if (sidebarOpen()) {
    <button
      type="button"
      class="fixed inset-0 z-40 bg-slate-950/50 lg:hidden"
      aria-label="Cerrar menú de navegación"
      (click)="closeSidebar()"></button>
  }

  <app-sidebar [mobileOpen]="sidebarOpen()" (closeRequested)="closeSidebar()"></app-sidebar>

  <div class="min-h-screen lg:pl-72">
    <header class="sticky top-0 z-30 border-b border-slate-200 bg-white/95 px-4 py-3 backdrop-blur sm:px-6 lg:px-8">
      <app-topbar (menuRequested)="openSidebar()"></app-topbar>
    </header>

    <main class="mx-auto w-full max-w-[1600px] p-4 sm:p-6 lg:p-8">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
